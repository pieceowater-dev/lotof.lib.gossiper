name: Tag and Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every one of the nineteen services builds against whatever this repo
  # last tagged, so a bad tag here breaks all of them at once and there is
  # no way to un-publish a Go module version. The same gates the services
  # run therefore have to pass before a tag exists at all (audit I2).
  # ubuntu-latest, not the self-hosted runner the nineteen services use:
  # this repository is public, and an organisation runner group refuses
  # public repositories unless someone turns that off deliberately. Public
  # repositories also get GitHub-hosted minutes for free, which is why the
  # tag job below kept working when the paid minutes ran out.
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          if ! git diff --exit-code --stat -- go.mod go.sum; then
            echo "::error::go.mod/go.sum are not tidy -- run 'go mod tidy' and commit the result" >&2
            exit 1
          fi

      - name: Install staticcheck
        run: |
          # staticcheck v0.8.1 bundles an x/tools that cannot read Go 1.27.2's export data
          # ("export data version 5 is greater than maximum supported version 4"); build it
          # against a newer x/tools instead (same fix as the services' ci.yml).
          tmp="$(mktemp -d)"
          (cd "$tmp" && go mod init sc >/dev/null 2>&1 \
            && GOFLAGS=-mod=mod go get honnef.co/go/tools@v0.8.1 golang.org/x/tools@v0.51.0 \
            && GOFLAGS=-mod=mod go build -o "$(go env GOPATH)/bin/staticcheck-xt51" honnef.co/go/tools/cmd/staticcheck)
          rm -rf "$tmp"

      - name: Lint
        run: |
          go vet ./...
          "$(go env GOPATH)/bin/staticcheck-xt51" ./...

      - name: Install gosec
        run: |
          if [ ! -x "$(go env GOPATH)/bin/gosec" ]; then
            go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          fi

      - name: Security scan
        run: '"$(go env GOPATH)/bin/gosec" -exclude-generated -exclude=G115,G602 -quiet ./...'

      - name: Install govulncheck
        run: |
          if [ ! -x "$(go env GOPATH)/bin/govulncheck" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          fi

      - name: Vulnerability scan
        run: "$(go env GOPATH)/bin/govulncheck ./..."

      - name: Run tests
        run: go test ./...

  tag:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch all tags
        run: |
          git fetch --tags

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)
          if [ -z "$TAG" ]; then
            TAG="v0.0.0"
          fi
          echo "Latest tag is $TAG"
          echo "LATEST_TAG=${TAG}" >> $GITHUB_ENV

      - name: Increment patch version
        id: increment_patch
        run: |
          TAG="${{ env.LATEST_TAG }}"
          echo "Current tag: $TAG"
          VERSION=${TAG#v}
          echo "Version without 'v': $VERSION"
          IFS='.' read -r -a VERSION_ARRAY <<< "$VERSION"
          echo "Version array: ${VERSION_ARRAY[@]}"
          PATCH=$((VERSION_ARRAY[2] + 1))
          echo "New patch version: $PATCH"
          NEW_TAG="v${VERSION_ARRAY[0]}.${VERSION_ARRAY[1]}.$PATCH"
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

      - name: Check if tag exists
        id: check_tag
        run: |
          echo "Checking if tag ${{ env.NEW_TAG }} exists..."
          if git ls-remote --tags origin | grep "${{ env.NEW_TAG }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.NEW_TAG }} already exists."
            exit 1
          fi

      - name: Create new tag
        run: |
          echo "Creating new tag ${{ env.NEW_TAG }}"
          git tag ${{ env.NEW_TAG }}
          git push origin ${{ env.NEW_TAG }}